<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>நிர்வாகி தளம் - விநாயகர் விழா 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: Arial, sans-serif; background: #fff7ed; color: #3f2a14; padding-bottom: 40px; }
        
        .header { background: linear-gradient(135deg, #b45309, #ea580c); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 12px rgba(180,83,9,0.3); }
        .header h1 { margin: 0; font-size: 22px; }
        .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #ffedd5; margin-bottom: 20px; }
        
        /* Auth Form */
        .login-card { max-width: 400px; margin: 40px auto; text-align: center; }
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #9a3412; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #fed7aa; border-radius: 10px; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #ea580c; box-shadow: 0 0 0 2px rgba(234,88,12,0.2); }
        
        .btn-primary { background: linear-gradient(135deg, #ea580c, #b45309); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(234,88,12,0.3); }
        .btn-danger { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-secondary { background: #fed7aa; color: #9a3412; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-refresh { background: #15803d; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Navigation Tabs */
        .admin-nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .nav-btn { background: white; border: 1px solid #fed7aa; color: #9a3412; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .nav-btn.active { background: #ea580c; color: white; border-color: #ea580c; }

        /* Tables */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        th { background: #ffedd5; color: #9a3412; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #ffedd5; }
        
        .error-msg { color: #dc2626; font-size: 12px; margin-top: 10px; text-align: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .action-group { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <header class="header">
        <h1>🔑 Admin Portal</h1>
        <p>விநாயகர் விழா 2026 - தரவு நிர்வாகம்</p>
    </header>

    <div class="container">

        <!-- 1. LOGIN SECTION -->
        <div id="section-login" class="card login-card">
            <h2>Admin Sign In</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>

        <!-- 2. DASHBOARD SECTION (Hidden by default) -->
        <div id="section-dashboard" style="display: none;">
            <div class="top-bar">
                <span id="user-email-badge" style="font-size: 13px; font-weight: bold; color: #9a3412;">Logged in</span>
                <div class="action-group">
                    <button onclick="triggerClientRefresh()" class="btn-refresh" id="btn-force-refresh">🔄 Refresh All Users</button>
                    <button onclick="handleLogout()" class="btn-secondary">🔒 Logout</button>
                </div>
            </div>

            <!-- LIVE USER PRESENCE TRACKER -->
            <div class="card" style="background: #fffaf5; border: 2px solid #fed7aa; margin-bottom: 15px;">
                <h3 style="margin-top: 0; color: #c2410c;">🟢 Live Active Users (Right Now)</h3>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center;">
                    <div style="background: white; padding: 12px; border-radius: 12px; border: 1px solid #fed7aa;">
                        <span style="font-size: 11px; color: #666; font-weight: bold; display: block;">Total Live</span>
                        <strong id="live-total" style="font-size: 22px; color: #15803d;">0</strong>
                    </div>
                    <div style="background: white; padding: 12px; border-radius: 12px; border: 1px solid #fed7aa;">
                        <span style="font-size: 11px; color: #666; font-weight: bold; display: block;">📱 PWA App</span>
                        <strong id="live-pwa" style="font-size: 22px; color: #ea580c;">0</strong>
                    </div>
                    <div style="background: white; padding: 12px; border-radius: 12px; border: 1px solid #fed7aa;">
                        <span style="font-size: 11px; color: #666; font-weight: bold; display: block;">🌐 Browser</span>
                        <strong id="live-browser" style="font-size: 22px; color: #2563eb;">0</strong>
                    </div>
                </div>
            </div>

            <!-- UNIQUE VISITORS TRACKER CARD -->
            <div class="card" style="background: #faf5ff; border: 2px solid #e9d5ff; margin-bottom: 20px;">
                <h3 style="margin-top: 0; color: #6b21a8;">📈 Total Unique Visitors (All-Time)</h3>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center;">
                    <div style="background: white; padding: 12px; border-radius: 12px; border: 1px solid #e9d5ff;">
                        <span style="font-size: 11px; color: #666; font-weight: bold; display: block;">👥 Total Unique</span>
                        <strong id="unique-total" style="font-size: 22px; color: #6b21a8;">0</strong>
                    </div>
                    <div style="background: white; padding: 12px; border-radius: 12px; border: 1px solid #e9d5ff;">
                        <span style="font-size: 11px; color: #666; font-weight: bold; display: block;">📱 PWA App</span>
                        <strong id="unique-pwa" style="font-size: 22px; color: #ea580c;">0</strong>
                    </div>
                    <div style="background: white; padding: 12px; border-radius: 12px; border: 1px solid #e9d5ff;">
                        <span style="font-size: 11px; color: #666; font-weight: bold; display: block;">🌐 Browser</span>
                        <strong id="unique-browser" style="font-size: 22px; color: #2563eb;">0</strong>
                    </div>
                </div>
            </div>

            <!-- Tab Switcher -->
            <div class="admin-nav">
                <button class="nav-btn active" onclick="switchAdminTab('friends', this)">🤝 Friends</button>
                <button class="nav-btn" onclick="switchAdminTab('sponsors', this)">⭐ Sponsors</button>
                <button class="nav-btn" onclick="switchAdminTab('area', this)">🏘️ Area</button>
                <button class="nav-btn" onclick="switchAdminTab('expenses', this)">💸 Expenses</button>
            </div>

            <!-- Entry Form Card -->
            <div class="card">
                <h3 id="form-title" style="margin-top: 0; color: #c2410c;">➕ Add New Entry</h3>
                <form id="admin-entry-form" onsubmit="handleFormSubmit(event)">
                    <div id="dynamic-fields"></div>
                    <button type="submit" class="btn-primary" id="save-btn" style="margin-top: 10px;">Save Record</button>
                    <div id="form-error" class="error-msg"></div>
                </form>
            </div>

            <!-- Existing Records Table -->
            <div class="card">
                <h3 style="margin-top: 0; color: #c2410c;">📋 Existing Records</h3>
                <div class="table-responsive">
                    <table>
                        <thead id="table-head"></thead>
                        <tbody id="table-body">
                            <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://fwwfkzruacigxeldemij.supabase.co"; 
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0c5eQ4pctlyarxQkg90BYw_SpyORtw6";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let activeTab = 'friends';
        let presenceChannel = null;
        const today = new Date().toISOString().split('T')[0];

        /* --- AUTHENTICATION ENGINE --- */
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('section-login').style.display = 'none';
                document.getElementById('section-dashboard').style.display = 'block';
                document.getElementById('user-email-badge').innerText = `👤 ${session.user.email}`;
                renderFormFields();
                loadTableData();
                setupPresenceListener();
                loadUniqueAnalytics();
            } else {
                document.getElementById('section-login').style.display = 'block';
                document.getElementById('section-dashboard').style.display = 'none';
            }
        }

        /* --- FETCH UNIQUE ANALYTICS --- */
        async function loadUniqueAnalytics() {
            const { data, error } = await supabaseClient
                .from('app_analytics')
                .select('is_pwa');

            if (error || !data) return;

            const totalUnique = data.length;
            const pwaUnique = data.filter(item => item.is_pwa).length;
            const browserUnique = totalUnique - pwaUnique;

            document.getElementById('unique-total').innerText = totalUnique;
            document.getElementById('unique-pwa').innerText = pwaUnique;
            document.getElementById('unique-browser').innerText = browserUnique;
        }

        /* --- PRESENCE TRACKER LISTENER --- */
        function setupPresenceListener() {
            if (presenceChannel) {
                supabaseClient.removeChannel(presenceChannel);
            }

            presenceChannel = supabaseClient.channel('festival-realtime-changes');

            presenceChannel
                .on('presence', { event: 'sync' }, () => {
                    const state = presenceChannel.presenceState();
                    let total = 0, pwaCount = 0, browserCount = 0;

                    for (const key in state) {
                        state[key].forEach(user => {
                            total++;
                            if (user.mode === 'PWA') pwaCount++;
                            else browserCount++;
                        });
                    }

                    document.getElementById('live-total').innerText = total;
                    document.getElementById('live-pwa').innerText = pwaCount;
                    document.getElementById('live-browser').innerText = browserCount;
                })
                .subscribe();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errDiv = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            errDiv.innerText = '';
            btn.disabled = true;
            btn.innerText = 'Signing In...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errDiv.innerText = error.message;
                btn.disabled = false;
                btn.innerText = 'Sign In';
            } else {
                checkSession();
            }
        }

        async function handleLogout() {
            if (presenceChannel) supabaseClient.removeChannel(presenceChannel);
            await supabaseClient.auth.signOut();
            checkSession();
        }

        /* --- MANUAL BROADCAST FORCE REFRESH --- */
        async function triggerClientRefresh() {
            const btn = document.getElementById('btn-force-refresh');
            btn.disabled = true;
            btn.innerText = 'Sending...';

            const channel = supabaseClient.channel('festival-realtime-changes');
            
            await channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await channel.send({
                        type: 'broadcast',
                        event: 'admin_force_refresh',
                        payload: { timestamp: new Date().toISOString() }
                    });
                    
                    alert('Refresh signal sent to all active users!');
                    btn.disabled = false;
                    btn.innerText = '🔄 Refresh All Users';
                    
                    supabaseClient.removeChannel(channel);
                }
            });
        }

        /* --- TAB & FORM SWITCHER --- */
        function switchAdminTab(tab, btn) {
            activeTab = tab;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderFormFields();
            loadTableData();
        }

        function renderFormFields() {
            const container = document.getElementById('dynamic-fields');
            const title = document.getElementById('form-title');

            if (activeTab === 'friends') {
                title.innerText = '➕ Add Friend Contribution';
                container.innerHTML = `
                    <div class="form-group"><label>Date</label><input type="date" id="f-date" value="${today}" required></div>
                    <div class="form-group"><label>Name</label><input type="text" id="f-name" placeholder="Contributor Name" required></div>
                    <div class="form-group"><label>Amount (₹)</label><input type="number" id="f-amount" placeholder="500" required></div>
                    <div class="form-group"><label>Given To</label><input type="text" id="f-given" placeholder="Received Person"></div>
                    <div class="form-group"><label>Remarks</label><input type="text" id="f-remarks" placeholder="Optional notes"></div>
                `;
            } else if (activeTab === 'sponsors') {
                title.innerText = '➕ Add Sponsor Entry';
                container.innerHTML = `
                    <div class="form-group"><label>Date</label><input type="date" id="f-date" value="${today}" required></div>
                    <div class="form-group"><label>Sponsor Name</label><input type="text" id="f-name" placeholder="Sponsor Name" required></div>
                    <div class="form-group"><label>Cash Amount (₹)</label><input type="number" id="f-amount" value="0"></div>
                    <div class="form-group"><label>Things Contributed</label><input type="text" id="f-things" placeholder="e.g. Rice Bag, Prasadam"></div>
                    <div class="form-group"><label>Given To</label><input type="text" id="f-given" placeholder="Received Person"></div>
                `;
            } else if (activeTab === 'area') {
                title.innerText = '➕ Add Daily Area Collection';
                container.innerHTML = `
                    <div class="form-group"><label>Collection Date</label><input type="date" id="f-date" value="${today}" required></div>
                    <div class="form-group"><label>Cash Amount (₹)</label><input type="number" id="f-cash" value="0" required></div>
                    <div class="form-group"><label>Online / UPI Amount (₹)</label><input type="number" id="f-online" value="0" required></div>
                    <div class="form-group"><label>Remarks</label><input type="text" id="f-remarks" placeholder="Street names / notes"></div>
                `;
            } else if (activeTab === 'expenses') {
                title.innerText = '➕ Add Expense Record';
                container.innerHTML = `
                    <div class="form-group"><label>Expense Date</label><input type="date" id="f-date" value="${today}" required></div>
                    <div class="form-group"><label>Item Involved</label><input type="text" id="f-item" placeholder="e.g. Flower Decoration" required></div>
                    <div class="form-group"><label>Amount (₹)</label><input type="number" id="f-amount" placeholder="1000" required></div>
                    <div class="form-group"><label>Paid By</label><input type="text" id="f-paidby" placeholder="Person who paid" required></div>
                    <div class="form-group"><label>Remarks</label><input type="text" id="f-remarks" placeholder="Optional notes"></div>
                `;
            }
        }

        /* --- DATA INSERTION --- */
        async function handleFormSubmit(e) {
            e.preventDefault();
            const errDiv = document.getElementById('form-error');
            const saveBtn = document.getElementById('save-btn');
            errDiv.innerText = '';
            saveBtn.disabled = true;

            let tableName = '', payload = {};

            if (activeTab === 'friends') {
                tableName = 'friend_contributions';
                payload = {
                    contribution_date: document.getElementById('f-date').value,
                    name: document.getElementById('f-name').value,
                    amount: Number(document.getElementById('f-amount').value),
                    given_to: document.getElementById('f-given').value,
                    remarks: document.getElementById('f-remarks').value
                };
            } else if (activeTab === 'sponsors') {
                tableName = 'sponsor_contributions';
                payload = {
                    contribution_date: document.getElementById('f-date').value,
                    name: document.getElementById('f-name').value,
                    amount: Number(document.getElementById('f-amount').value || 0),
                    things_contributed: document.getElementById('f-things').value,
                    given_to: document.getElementById('f-given').value
                };
            } else if (activeTab === 'area') {
                tableName = 'area_collections';
                const cash = Number(document.getElementById('f-cash').value || 0);
                const online = Number(document.getElementById('f-online').value || 0);
                payload = {
                    collection_date: document.getElementById('f-date').value,
                    cash_amount: cash,
                    online_amount: online,
                    total_amount: cash + online,
                    remarks: document.getElementById('f-remarks').value
                };
            } else if (activeTab === 'expenses') {
                tableName = 'expenses';
                payload = {
                    expense_date: document.getElementById('f-date').value,
                    item: document.getElementById('f-item').value,
                    amount: Number(document.getElementById('f-amount').value),
                    paid_by: document.getElementById('f-paidby').value,
                    remarks: document.getElementById('f-remarks').value
                };
            }

            const { error } = await supabaseClient.from(tableName).insert([payload]);
            saveBtn.disabled = false;

            if (error) {
                errDiv.innerText = error.message;
            } else {
                renderFormFields();
                loadTableData();
            }
        }

        /* --- TABLE DATA LOADING & DELETION --- */
        async function loadTableData() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            body.innerHTML = '<tr><td colspan="5" style="text-align: center;">Loading...</td></tr>';

            let tableName = '';
            if (activeTab === 'friends') tableName = 'friend_contributions';
            if (activeTab === 'sponsors') tableName = 'sponsor_contributions';
            if (activeTab === 'area') tableName = 'area_collections';
            if (activeTab === 'expenses') tableName = 'expenses';

            const { data, error } = await supabaseClient
                .from(tableName)
                .select('*')
                .order('id', { ascending: false });

            if (error || !data || data.length === 0) {
                body.innerHTML = '<tr><td colspan="5" style="text-align: center;">No records found.</td></tr>';
                return;
            }

            if (activeTab === 'friends') {
                head.innerHTML = '<tr><th>Date</th><th>Name</th><th>Amount</th><th>Given To</th><th>Action</th></tr>';
                body.innerHTML = data.map(i => `
                    <tr>
                        <td>${i.contribution_date || i.date || '-'}</td>
                        <td><strong>${i.name || '-'}</strong></td>
                        <td style="color:#15803d; font-weight:bold;">₹${i.amount || 0}</td>
                        <td>${i.given_to || '-'}</td>
                        <td><button onclick="deleteRecord('friend_contributions', '${i.id}')" class="btn-danger">Delete</button></td>
                    </tr>
                `).join('');
            } else if (activeTab === 'sponsors') {
                head.innerHTML = '<tr><th>Date</th><th>Name</th><th>Cash</th><th>Things</th><th>Action</th></tr>';
                body.innerHTML = data.map(i => `
                    <tr>
                        <td>${i.contribution_date || '-'}</td>
                        <td><strong>${i.name || '-'}</strong></td>
                        <td style="color:#15803d; font-weight:bold;">₹${i.amount || 0}</td>
                        <td>${i.things_contributed || '-'}</td>
                        <td><button onclick="deleteRecord('sponsor_contributions', '${i.id}')" class="btn-danger">Delete</button></td>
                    </tr>
                `).join('');
            } else if (activeTab === 'area') {
                head.innerHTML = '<tr><th>Date</th><th>Total</th><th>Cash</th><th>Online</th><th>Action</th></tr>';
                body.innerHTML = data.map(i => `
                    <tr>
                        <td>${i.collection_date || '-'}</td>
                        <td style="color:#15803d; font-weight:bold;">₹${i.total_amount || 0}</td>
                        <td>₹${i.cash_amount || 0}</td>
                        <td>₹${i.online_amount || 0}</td>
                        <td><button onclick="deleteRecord('area_collections', '${i.id}')" class="btn-danger">Delete</button></td>
                    </tr>
                `).join('');
            } else if (activeTab === 'expenses') {
                head.innerHTML = '<tr><th>Date</th><th>Item</th><th>Amount</th><th>Paid By</th><th>Action</th></tr>';
                body.innerHTML = data.map(i => `
                    <tr>
                        <td>${i.expense_date || '-'}</td>
                        <td><strong>${i.item || '-'}</strong></td>
                        <td style="color:#b91c1c; font-weight:bold;">₹${i.amount || 0}</td>
                        <td>${i.paid_by || '-'}</td>
                        <td><button onclick="deleteRecord('expenses', '${i.id}')" class="btn-danger">Delete</button></td>
                    </tr>
                `).join('');
            }
        }

        async function deleteRecord(tableName, id) {
            if (!id) {
                alert("Error: Record ID is undefined or missing.");
                return;
            }
            
            if (!confirm('Are you sure you want to delete this record?')) return;

            const { error, count } = await supabaseClient
                .from(tableName)
                .delete({ count: 'exact' })
                .eq('id', id);

            if (error) {
                alert('Delete error: ' + error.message);
                console.error('Delete failure:', error);
            } else if (count === 0) {
                alert('Delete blocked by RLS policy. Change policy Target Role in Supabase to public/anon.');
            } else {
                loadTableData();
            }
        }

        window.addEventListener('DOMContentLoaded', checkSession);
    </script>
</body>
</html>
